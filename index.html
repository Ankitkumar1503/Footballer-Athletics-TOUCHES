<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/touches-favicon-1.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TOUCHES" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TOUCHES</title>
  <script>
    window.deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredInstallPrompt = e;
      // console.log('[PWA INSTALL] Global beforeinstallprompt event captured!', e);
      window.dispatchEvent(new CustomEvent('pwa-installable', { detail: e }));
    });
  </script>
</head>


<body>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function (e) {
      if (e.message === 'ResizeObserver loop limit exceeded') return;
      document.body.innerHTML = '<div style="color:red; padding:20px; font-family:monospace; white-space:pre-wrap; background:white;"><h1>GLOBAL ERROR</h1>' + e.message + ' at ' + e.filename + ':' + e.lineno + '</div>';
    });
    window.addEventListener('unhandledrejection', function (e) {
      const msg = e.reason && (e.reason.message || e.reason);
      document.body.innerHTML = '<div style="color:red; padding:20px; font-family:monospace; white-space:pre-wrap; background:white;"><h1>PROMISE REJECTION</h1>' + msg + '</div>';
    });
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
